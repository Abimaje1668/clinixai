<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClinixAI | Account Setup</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: linear-gradient(135deg, #075985, #0284c7);
  color: white;
  padding: 24px;
  text-align: center;
}

main {
  max-width: 450px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
  color: #0369a1;
}

input {
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  background: #0284c7;
  color: white;
  padding: 14px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.status {
  margin-top: 15px;
  font-size: 14px;
}

[hidden] {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <h1>🩺 ClinixAI</h1>
  <p>Secure Account Setup</p>
</header>

<main>
  <section class="card">

    <h2>Welcome to ClinixAI</h2>

    <p id="instructions">
      Verifying your invitation...
    </p>

    <form id="passwordForm" hidden>

      <label for="password">Create Password</label>
      <input
        type="password"
        id="password"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        minlength="12"
        autocomplete="new-password"
        required
      >

      <button type="submit" id="saveButton">
        Set My Password
      </button>

    </form>

    <p id="message" class="status" role="status"></p>

    <p>
      <a href="./login.html">Return to Login</a>
    </p>

  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL =
  "https://egqruhbudiubvkxjonub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_eZB6mHH69eHHXgnnJBP4nQ_6LBhlluo";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth: {
      detectSessionInUrl: true
    }
  }
);

const form = document.getElementById("passwordForm");
const message = document.getElementById("message");
const instructions = document.getElementById("instructions");

async function verifyInvitation() {
  try {
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code");
    const tokenHash = url.searchParams.get("token_hash");
    const type = url.searchParams.get("type");

    if (code) {
      const { error } =
        await client.auth.exchangeCodeForSession(code);

      if (error) throw error;
    } else if (tokenHash && type === "invite") {
      const { error } =
        await client.auth.verifyOtp({
          token_hash: tokenHash,
          type: "invite"
        });

      if (error) throw error;
    }

    const { data, error } = await client.auth.getUser();

    if (error || !data.user) {
      instructions.textContent =
        "This invitation is invalid, expired, or has not been verified.";
      return;
    }

    // Confirm the authenticated user has a profile
    const { data: profile, error: profileError } =
      await client
        .from("profiles")
        .select("username, role, account_status")
        .eq("id", data.user.id)
        .single();

    if (profileError || !profile) {
      instructions.textContent =
        "Your account profile could not be verified. Contact your administrator.";
      return;
    }

    if (profile.account_status !== "pending") {
      instructions.textContent =
        "This account is not awaiting initial setup. Contact your administrator.";
      return;
    }

    instructions.textContent =
      "Hello " + (profile.username || "there") +
      "! Create a secure password to finish setting up your account.";

    form.hidden = false;

  } catch (error) {
    console.error(error);

    instructions.textContent =
      "Unable to verify your invitation. Please contact your administrator.";
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password !== confirmPassword) {
    message.style.color = "#dc2626";
    message.textContent = "Passwords do not match.";
    return;
  }

  const button = document.getElementById("saveButton");

  button.disabled = true;
  button.textContent = "Saving password...";

  try {
    const { error } =
      await client.auth.updateUser({
        password
      });

    if (error) throw error;

    form.hidden = true;

    instructions.textContent =
      "Your password has been created successfully.";

    message.style.color = "#15803d";
    message.textContent =
      "Account setup complete. Your administrator must activate your account before you can access clinical functions.";

    await client.auth.signOut();

  } catch (error) {
    message.style.color = "#dc2626";
    message.textContent = error.message;

  } finally {
    button.disabled = false;
    button.textContent = "Set My Password";
  }
});

verifyInvitation();
</script>

</body>
</html>
