<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0284c7">
<meta name="description" content="ClinixAI Clinical Prescription Assistant">

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">

<title>ClinixAI 2.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: linear-gradient(135deg, #075985, #0284c7);
  color: white;
  padding: 22px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 8px 0 0;
  font-size: 13px;
}

.container {
  max-width: 950px;
  margin: auto;
  padding: 16px;
  padding-bottom: 95px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

h2 {
  font-size: 19px;
  color: #0369a1;
  margin-top: 0;
}

label {
  display: block;
  margin-top: 14px;
  font-size: 14px;
  font-weight: bold;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 15px;
  background: white;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

button {
  border: none;
  background: #0284c7;
  color: white;
  padding: 12px 17px;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
  margin-top: 12px;
}

button:active {
  opacity: 0.8;
}

.secondary {
  background: #475569;
}

.danger {
  background: #dc2626;
}

.success {
  background: #16a34a;
}

.notice {
  background: #fff7ed;
  border-left: 4px solid #f97316;
  color: #9a3412;
  padding: 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 18px;
}

.dashboard {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.stat {
  background: #eff6ff;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
}

.stat strong {
  display: block;
  font-size: 25px;
  color: #0369a1;
}

.stat span {
  font-size: 12px;
  color: #475569;
}

.medication {
  border: 1px solid #cbd5e1;
  padding: 15px;
  border-radius: 10px;
  margin-top: 15px;
  background: #f8fafc;
}

.medication h3 {
  margin-top: 0;
  font-size: 15px;
  color: #0369a1;
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  display: flex;
  justify-content: space-around;
  padding: 12px 4px;
  box-shadow: 0 -3px 12px rgba(0,0,0,0.1);
  z-index: 100;
}

.bottom-nav button {
  background: transparent;
  color: #0369a1;
  font-size: 12px;
  padding: 8px 5px;
  margin: 0;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

#prescriptionDocument {
  display: none;
  background: white;
  padding: 25px;
  border-radius: 10px;
}

.rx-header {
  text-align: center;
  border-bottom: 2px solid #0284c7;
  padding-bottom: 15px;
}

.rx-header h2 {
  margin-bottom: 5px;
}

.rx-section {
  margin-top: 18px;
}

.rx-section h3 {
  color: #0369a1;
  border-bottom: 1px solid #e2e8f0;
  padding-bottom: 7px;
}

.rx-row {
  margin: 8px 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.rx-med {
  border-bottom: 1px solid #e2e8f0;
  padding: 12px 0;
}

.print-buttons {
  margin-top: 20px;
}

@media print {
  @page {
    size: A4;
    margin: 15mm;
  }

  body {
    background: white;
  }

  header,
  .container,
  .bottom-nav,
  .print-buttons {
    display: none !important;
  }

  #prescriptionDocument {
    display: block !important;
    padding: 0;
    border: none;
    border-radius: 0;
  }

  .rx-med {
    break-inside: avoid;
  }
}
</style>
</head>

<body>

<header>
  <h1>🩺 ClinixAI</h1>
  <p>Clinical Prescription Assistant | Version 2.0</p>
</header>

<div class="container">
